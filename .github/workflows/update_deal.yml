name: Update Corporate Sunday Deal

on:
  schedule:
    - cron: '0 21 * * 6' # 00:00 ראשון בקיץ - שעון קיץ ישראל UTC+3
    - cron: '0 22 * * 6' # 00:00 ראשון בחורף - שעון חורף ישראל UTC+2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deal:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem  # <-- זה הכי חשוב
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright
          playwright install chromium --with-deps
      - run: python scraper.py
      
      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add deal.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Sunday deal - $(TZ='Asia/Jerusalem' date) [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
