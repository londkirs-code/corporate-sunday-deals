name: Update Corporate Sunday Deal
on:
  schedule:
    - cron: '0,30 21,22,23 * * 6'
    - cron: '0,30 0,1 * * 0'
  workflow_dispatch:
jobs:
  update-deal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Scrape as Israel time
        run: python scraper.py
      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: |
            debug.png
            debug.html
            deal.json
      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add deal.json docs/deal.json index.html docs/index.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Sunday deal - $(TZ='Asia/Jerusalem' date) [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
