name: Update Corporate Sunday Deal

on:
  schedule:
    - cron: '0 6 * * 0'  # רק פעם אחת ביום ראשון ב-09:00 שעון ישראל
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deal:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.48.0-jammy
      # בתמונה הזאת הכרום כבר מותקן - לא צריך להתקין כלום
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add deal.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Sunday deal [skip ci]" && git push)
